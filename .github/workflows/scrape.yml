name: Spider Shop Spiderlings Scrape

on:
  schedule:
    - cron: "10 6 1,15 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python setup
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ------------------------------------------------
      # Find latest spidershop-history artifact (any run)
      # ------------------------------------------------
      - name: Find latest history artifact
        id: history_artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT_ID=$(gh api \
            repos/${{ github.repository }}/actions/artifacts \
            --paginate \
            -q '.artifacts
                | map(select(.name == "spidershop-history" and .expired == false))
                | sort_by(.created_at)
                | last
                | .id' || true)

          echo "artifact_id=$ARTIFACT_ID" >> $GITHUB_OUTPUT
          echo "Resolved history artifact id: $ARTIFACT_ID"

      # ------------------------------------------------
      # Download history artifact if it exists
      # ------------------------------------------------
      - name: Download previous history artifact
        if: steps.history_artifact.outputs.artifact_id != ''
        run: |
          gh api \
            repos/${{ github.repository }}/actions/artifacts/${{ steps.history_artifact.outputs.artifact_id }}/zip \
            > history.zip

          unzip -o history.zip
          rm history.zip

      # -----------------------------
      # Run scraper
      # -----------------------------
      - name: Run Spider Shop scraper
        run: |
          python scrape_spidershop_spiderlings.py

      # -----------------------------
      # Upload snapshot
      # -----------------------------
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidershop-snapshot
          path: spidershop_spiderlings_scrape.csv
          if-no-files-found: error

      # -----------------------------
      # Upload updated history
      # -----------------------------
      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidershop-history
          path: spidershop_spiderlings_history.csv
          if-no-files-found: error
