name: Spider Shop Spiderlings Scrape

on:
  schedule:
    - cron: "10 6 1,15 * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Python setup
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # -----------------------------
      # Find last successful run-id (ROBUST METHOD)
      # -----------------------------
      - name: Find last successful workflow run on this branch
        id: last_run
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_NAME: Spider Shop Spiderlings Scrape
        run: |
          RUN_ID=$(gh api \
            repos/${{ github.repository }}/actions/runs \
            --paginate \
            -q '.workflow_runs
                | map(select(
                    .head_branch == "${{ github.ref_name }}" and
                    .conclusion == "success" and
                    .name == env.WORKFLOW_NAME and
                    .id != ${{ github.run_id }}
                  ))
                | sort_by(.run_number)
                | last
                | .id' || true)

          echo "run_id=$RUN_ID" >> $GITHUB_OUTPUT
          echo "Resolved previous run-id: $RUN_ID"

      # -----------------------------
      # Download history artifact (if exists)
      # -----------------------------
      - name: Download previous history artifact
        if: steps.last_run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: spidershop-history
          run-id: ${{ steps.last_run.outputs.run_id }}
          path: .

      # -----------------------------
      # Run scraper
      # -----------------------------
      - name: Run Spider Shop scraper
        run: |
          python scrape_spidershop_spiderlings.py

      # -----------------------------
      # Upload snapshot
      # -----------------------------
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidershop-snapshot
          path: spidershop_spiderlings_scrape.csv
          if-no-files-found: error

      # -----------------------------
      # Upload updated history
      # -----------------------------
      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidershop-history
          path: spidershop_spiderlings_history.csv
          if-no-files-found: error
