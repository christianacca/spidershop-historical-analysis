name: Spider Shop Spiderlings Scrape

on:
  schedule:
    # Run weekly (Wednesday 06:10 UTC)
    - cron: "10 6 * * 3"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    steps:
      # --------------------------------
      # Checkout repository
      # --------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # Python setup
      # --------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------
      # Resolve branch + artifact names
      # --------------------------------
      - name: Resolve branch-scoped artifact names
        id: artifact_names
        run: |
          DEFAULT_BRANCH="master"
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SAFE_BRANCH="$(echo "$BRANCH_NAME" | tr '/' '-')"

          if [ "$BRANCH_NAME" = "$DEFAULT_BRANCH" ]; then
            HISTORY_NAME="spidershop-history"
          else
            HISTORY_NAME="spidershop-history__${SAFE_BRANCH}"
          fi

          echo "history_name=$HISTORY_NAME" >> $GITHUB_OUTPUT
          echo "default_history_name=spidershop-history" >> $GITHUB_OUTPUT

          echo "Resolved branch: $BRANCH_NAME"
          echo "Resolved history artifact name: $HISTORY_NAME"

      # ------------------------------------------------
      # Download history artifact (branch-scoped with fallback)
      # ------------------------------------------------
      - name: Download previous history artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_OWNER="$(echo '${{ github.repository }}' | cut -d'/' -f1)"
          REPO_NAME="$(echo '${{ github.repository }}' | cut -d'/' -f2)"
          
          # Try branch-scoped history first
          if ./scripts/download_artifact.sh "$REPO_OWNER" "$REPO_NAME" \
              "${{ steps.artifact_names.outputs.history_name }}" "."; then
            echo "✅ Downloaded branch history: ${{ steps.artifact_names.outputs.history_name }}"
          # Fallback to default branch history (if not on default branch)
          elif [ "${{ github.ref_name }}" != "master" ]; then
            echo "⚠️  Branch history not found, trying default branch..."
            if ./scripts/download_artifact.sh "$REPO_OWNER" "$REPO_NAME" \
                "${{ steps.artifact_names.outputs.default_history_name }}" "."; then
              echo "✅ Downloaded default history: ${{ steps.artifact_names.outputs.default_history_name }}"
            else
              echo "ℹ️  No previous history found (this may be the first run)"
            fi
          else
            echo "ℹ️  No previous history found (this may be the first run)"
          fi

      # --------------------------------
      # Run scraper + analysis
      # --------------------------------
      - name: Run Spider Shop scraper
        id: scraper
        run: |
          python src/scrape_spidershop_spiderlings.py
          
          # Capture the summary markdown as a step output
          if [ -f "$GITHUB_STEP_SUMMARY" ]; then
            echo "summary_content<<EOF" >> $GITHUB_OUTPUT
            cat "$GITHUB_STEP_SUMMARY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      # --------------------------------
      # Save job summary as artifact
      # --------------------------------
      - name: Save analysis summary
        if: always()
        run: |
          # Write the summary content from the previous step to analysis_summary.md
          cat > analysis_summary.md << 'EOF'
          ${{ steps.scraper.outputs.summary_content }}
          EOF

      - name: Upload analysis summary
        uses: actions/upload-artifact@v4
        with:
          name: analysis-summary
          path: analysis_summary.md
          if-no-files-found: warn

      # --------------------------------
      # Upload snapshot CSV (this run)
      # --------------------------------
      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: spidershop-snapshot
          path: spidershop_spiderlings_scrape.csv
          if-no-files-found: error

      # --------------------------------
      # Upload updated history CSV (branch-scoped)
      # --------------------------------
      - name: Upload history artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_names.outputs.history_name }}
          path: spidershop_spiderlings_history.csv
          if-no-files-found: error

      # --------------------------------
      # Upload breeder opportunity matrix
      # --------------------------------
      - name: Upload breeder opportunity table
        uses: actions/upload-artifact@v4
        with:
          name: breeder-opportunity-table
          path: breeder_opportunity_table.csv
          if-no-files-found: ignore

      # --------------------------------
      # Upload dealer supply risk matrix
      # --------------------------------
      - name: Upload dealer supply risk table
        uses: actions/upload-artifact@v4
        with:
          name: dealer-supply-risk-table
          path: dealer_supply_risk_table.csv
          if-no-files-found: ignore
