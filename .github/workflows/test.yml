name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pull-requests: write  # For PR comments with coverage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Layer 1: Fast client tests (earliest failure) ────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Node dependencies
        run: cd client && npm ci

      - name: Run client tests (unit + coverage)
        run: make test-client

      # ── Layer 2: Browser-backed visual contracts ─────────────────────────────
      - name: Cache Playwright browsers (Node)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-node-chromium-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}
          restore-keys: |
            playwright-node-chromium-${{ runner.os }}-

      - name: Run browser-backed visual contract tests
        run: make test-visual

      # ── Layer 3: Python tests and coverage ───────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build client assets
        run: cd client && npm run build

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-report=html \
            --cov-report=json \
            --cov-report=term \
            --cov-report=term-missing \
            -v

      - name: Generate coverage summary
        if: always()
        run: |
          echo "# Test Coverage Report" > coverage-summary.md
          echo "" >> coverage-summary.md
          echo "## Coverage Summary" >> coverage-summary.md
          echo "" >> coverage-summary.md
          
          # Extract coverage percentage from JSON
          COVERAGE=$(python -c "import json; data=json.load(open('tmp/coverage/coverage.json')); print(f\"{data['totals']['percent_covered']:.2f}\")")
          echo "**Total Coverage: ${COVERAGE}%**" >> coverage-summary.md
          echo "" >> coverage-summary.md
          
          echo "## Coverage by Module" >> coverage-summary.md
          echo "" >> coverage-summary.md
          echo "| File | Statements | Missing | Excluded | Coverage |" >> coverage-summary.md
          echo "|------|-----------|---------|----------|----------|" >> coverage-summary.md
          
          python -c "
          import json
          data = json.load(open('tmp/coverage/coverage.json'))
          for file, stats in sorted(data['files'].items()):
              if 'src/' in file:
                  name = file.split('/')[-1]
                  stmts = stats['summary']['num_statements']
                  missing = stats['summary']['missing_lines']
                  excluded = stats['summary']['excluded_lines']
                  cov = stats['summary']['percent_covered']
                  print(f'| {name} | {stmts} | {missing} | {excluded} | {cov:.2f}% |')
          " >> coverage-summary.md
          
          echo "" >> coverage-summary.md
          echo "## Detailed HTML Report" >> coverage-summary.md
          echo "" >> coverage-summary.md
          echo "Download the \`test-coverage-report\` artifact to view the full HTML coverage report." >> coverage-summary.md
          
          cat coverage-summary.md

      - name: Upload coverage summary as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.md
          retention-days: 90

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage-report
          path: tmp/coverage/html/
          retention-days: 90

      - name: Upload coverage JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: tmp/coverage/coverage.json
          retention-days: 90

      - name: Add coverage comment to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('coverage-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });

      - name: Check coverage threshold
        run: |
          COVERAGE=$(python -c "import json; data=json.load(open('tmp/coverage/coverage.json')); print(data['totals']['percent_covered'])")
          THRESHOLD=80
          
          echo "Coverage: ${COVERAGE}%"
          echo "Threshold: ${THRESHOLD}%"
          
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi

  e2e-tests:
    runs-on: ubuntu-latest
    # Layer 4: runs in parallel with the test job.
    # Wasted E2E runs are prevented by the file-change conditional guard below —
    # on PRs, this job only runs when client, templates, website, or e2e files
    # change. The cheap unit/visual/Python layers surface regressions faster;
    # E2E adds browser-level confidence without blocking on them sequentially.
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for changed-files detection

      - name: Detect changed files
        id: changes
        uses: tj-actions/changed-files@v44
        with:
          files_yaml: |
            website:
              - 'src/website/**'
            templates:
              - 'templates/**'
            e2e_tests:
              - 'tests/e2e/**'
            client:
              - 'client/**'
          # For PRs: compare entire PR branch against base (master)
          # For pushes to master: compare current commit against previous
          base_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Check if e2e tests should run
        id: should-run
        run: |
          # Always run on master pushes
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✅ Running e2e tests (master branch push)"
            exit 0
          fi
          
          # On PRs: only run if relevant files changed
          if [[ "${{ steps.changes.outputs.website_any_changed }}" == "true" ]] || \
             [[ "${{ steps.changes.outputs.templates_any_changed }}" == "true" ]] || \
             [[ "${{ steps.changes.outputs.e2e_tests_any_changed }}" == "true" ]] || \
             [[ "${{ steps.changes.outputs.client_any_changed }}" == "true" ]]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✅ Running e2e tests (relevant files changed)"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "⏭️  Skipping e2e tests (no relevant file changes)"
          fi

      - name: Set up Python
        if: steps.should-run.outputs.should-run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.should-run.outputs.should-run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Build client assets
        if: steps.should-run.outputs.should-run == 'true'
        uses: ./.github/actions/build-client

      # Cache the Python Playwright browser binary to avoid a ~100 MB download on every run.
      # The cache key uses the installed playwright version so a package upgrade automatically
      # invalidates the stale browser entry.
      - name: Get installed Playwright version
        id: playwright-version
        if: steps.should-run.outputs.should-run == 'true'
        run: echo "version=$(python -m playwright --version | cut -d' ' -f2)" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers (Python)
        if: steps.should-run.outputs.should-run == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-python-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            playwright-python-chromium-${{ runner.os }}-

      - name: Run E2E smoke tests
        if: steps.should-run.outputs.should-run == 'true'
        run: |
          python -m playwright install chromium
          RUN_E2E=1 pytest tests/e2e -m e2e -v

      - name: Upload E2E traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: |
            tmp/e2e-trace.zip
            website/
          retention-days: 7
          if-no-files-found: warn

      - name: Generate trace report link
        if: failure()
        run: |
          echo "## 🔍 E2E Test Failure" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download the \`e2e-traces\` artifact to debug:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# 1. Download the e2e-traces artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "# 2. Extract it" >> $GITHUB_STEP_SUMMARY
          echo "# 3. View the trace:" >> $GITHUB_STEP_SUMMARY
          echo "playwright show-trace tmp/e2e-trace.zip" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The trace viewer shows:" >> $GITHUB_STEP_SUMMARY
          echo "- 📸 Screenshots of every action" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Network activity" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 DOM snapshots at each step" >> $GITHUB_STEP_SUMMARY
          echo "- ⏱️ Timeline of all operations" >> $GITHUB_STEP_SUMMARY
